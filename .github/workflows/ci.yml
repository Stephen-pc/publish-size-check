name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 规格库自检
        run: python scripts/spec.py --validate

      - name: 回归测试
        run: python scripts/test_spec.py

      - name: 冒烟测试（各命令可正常返回）
        shell: bash
        run: |
          python scripts/spec.py --list
          python scripts/spec.py --spec 小红书
          python scripts/spec.py --help
          python demo.py > /dev/null

  no-deps:
    name: 保证零依赖
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 本项目的核心承诺是「零依赖、开箱即跑」。
      # 这条 CI 会拦住任何悄悄引入第三方 import 的提交。
      - name: 检查未引入第三方依赖
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path

          ALLOWED = {
              "argparse", "json", "os", "struct", "sys", "zlib", "re",
              "tempfile", "subprocess", "shutil", "pathlib", "typing",
              "collections", "math", "itertools", "textwrap", "unicodedata",
              "datetime", "io", "unicodedata", "hashlib",
              "spec", "test_spec",
          }
          bad = []
          for f in list(Path("scripts").glob("*.py")):
              tree = ast.parse(f.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          mod = a.name.split(".")[0]
                          if mod not in ALLOWED:
                              bad.append(f"{f}:{node.lineno} import {a.name}")
                  elif isinstance(node, ast.ImportFrom):
                      mod = (node.module or "").split(".")[0]
                      if mod and mod not in ALLOWED:
                          bad.append(f"{f}:{node.lineno} from {node.module}")

          if bad:
              print("发现疑似第三方依赖：")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("OK：仅使用标准库")
          PY

  windows-encoding:
    name: Windows 控制台编码
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Windows 上 Python 默认按控制台代码页（cp1252/cp936）编码 stdout，
      # 输出中文会抛 UnicodeEncodeError。Linux/macOS 默认 UTF-8，所以这个坑
      # 在开发机上根本看不到 —— 曾经真的让 CI 挂了，故单独立一条守住。
      - name: 强制非 UTF-8 代码页下运行
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($enc in @("cp1252", "cp936", "ascii")) {
            Write-Host "--- PYTHONIOENCODING=$enc ---"
            $env:PYTHONIOENCODING = $enc
            python scripts/spec.py --validate
            if ($LASTEXITCODE -ne 0) {
              throw "在 $enc 编码下退出码为 $LASTEXITCODE"
            }
          }
          Write-Host "OK：非 UTF-8 编码下均可正常运行"

  spec-freshness:
    name: 规格库时效
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 平台会改版，规格库超过 180 天就该复核。
      # 这里只提示不失败——除非真的过期太久。
      - name: 检查规格库是否过期
        run: python scripts/spec.py --validate

  plugin:
    name: 插件包一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 仓库是双入口：根目录是技能形态，plugins/publish-check/ 是插件形态。
      # 两处技能文件必须逐字节相同，否则装了插件的人拿到的和仓库里看到的不是一回事。
      # 这条 CI 把「记得同步」从人的纪律变成机器的检查。
      - name: 技能文件在两种形态下逐字节一致
        run: |
          set -e
          SRC_TO_DST="
          SKILL.md:plugins/publish-check/skills/publish-check/SKILL.md
          demo.py:plugins/publish-check/skills/publish-check/demo.py
          scripts/spec.py:plugins/publish-check/skills/publish-check/scripts/spec.py
          scripts/test_spec.py:plugins/publish-check/skills/publish-check/scripts/test_spec.py
          references/platforms.json:plugins/publish-check/skills/publish-check/references/platforms.json
          "
          fail=0
          for pair in $SRC_TO_DST; do
            src="${pair%%:*}"
            dst="${pair#*:}"
            if [ ! -f "$dst" ]; then
              echo "缺失: $dst"
              fail=1
              continue
            fi
            if cmp -s "$src" "$dst"; then
              echo "OK   $src == $dst"
            else
              echo "不一致: $src != $dst"
              fail=1
            fi
          done
          exit $fail

      # 插件清单的字段错了，用户在 /plugin install 那一步才会发现。
      # 这条在提交时就拦住：JSON 可解析、name 合法、source 指向真实目录、
      # skills 声明能落到含 SKILL.md 的目录。
      - name: 插件清单校验
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path

          NAME_RE = re.compile(r"^[a-z][a-z0-9]*(-[a-z0-9]+)*$")
          errors = []

          mp = Path(".codebuddy-plugin/marketplace.json")
          if not mp.is_file():
              sys.exit("缺少 .codebuddy-plugin/marketplace.json")
          market = json.loads(mp.read_text(encoding="utf-8"))

          if not NAME_RE.match(market.get("name", "")):
              errors.append(f"marketplace.name 不合法: {market.get('name')!r}")
          if "owner" not in market:
              errors.append("marketplace.owner 缺失")
          if not market.get("plugins"):
              errors.append("marketplace.plugins 为空")

          for entry in market.get("plugins", []):
              pname = entry.get("name", "")
              if not NAME_RE.match(pname):
                  errors.append(f"插件名不合法: {pname!r}")
              for field in ("source", "description"):
                  if not entry.get(field):
                      errors.append(f"插件 {pname} 缺 {field}")

              src = Path(entry.get("source", "").lstrip("./"))
              pj = src / ".codebuddy-plugin" / "plugin.json"
              if not pj.is_file():
                  errors.append(f"插件 {pname} 缺 {pj}")
                  continue
              plugin = json.loads(pj.read_text(encoding="utf-8"))
              if plugin.get("name") != pname:
                  errors.append(
                      f"{pj} 的 name={plugin.get('name')!r} 与市场条目 {pname!r} 不一致"
                  )
              if not plugin.get("version"):
                  errors.append(f"{pj} 缺 version")

              for rel in plugin.get("skills", []):
                  d = src / rel.lstrip("./")
                  if not (d / "SKILL.md").is_file():
                      errors.append(f"插件 {pname} 的 skills 路径无 SKILL.md: {rel}")

          if errors:
              print("插件清单有问题：")
              for e in errors:
                  print("  " + e)
              sys.exit(1)
          print("OK：市场与插件清单均合法")
          PY

      # 在插件目录内跑一遍，确认打包后仍然跑得起来（相对路径没写死）。
      - name: 插件形态下冒烟测试
        run: |
          cd plugins/publish-check/skills/publish-check
          python scripts/spec.py --validate
          python scripts/test_spec.py
          python demo.py > /dev/null
          python scripts/spec.py --list

  dsh:
    name: DSH 插件包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 声明了 dsh.bundle 只能证明「这个包声称自己是 DSH 插件」，证明不了「它真的能被加载」。
      # 这里用一个假 ctx 走完 apply() → list() → get()，并验证 SKILL.md 正文里引用的
      # 相对路径真的落在包根下 —— 插件清单写错时，用户在 dsh plugin add 那一步才会发现。
      - name: 仓库形态自检
        run: node tools/dsh-selftest.mjs

      # 上面那步测的是仓库，不是用户拿到的东西。npm 的 files 字段漏一个目录，
      # 仓库里一切正常、装完却跑不起来 —— 这种错只有用户会撞上，所以这里真打一次包。
      - name: 打包后按安装形态自检
        run: |
          set -e
          mkdir -p /tmp/pkg /tmp/sim/node_modules
          npm pack --pack-destination /tmp/pkg
          tar xzf /tmp/pkg/*.tgz -C /tmp/sim/node_modules
          mv /tmp/sim/node_modules/package /tmp/sim/node_modules/publish-size-check
          node tools/dsh-selftest.mjs /tmp/sim/node_modules/publish-size-check

      # 技能本体是 Python，但 dsh 的加载路径是 Node。装完之后脚本还得真的跑得起来，
      # 且 resourceBase 指向的基准目录下确实有 scripts/ —— 两件事分开验证。
      - name: 安装形态下脚本仍可执行
        run: |
          set -e
          cd /tmp/sim/node_modules/publish-size-check
          python3 scripts/spec.py --validate
          python3 scripts/spec.py --list > /dev/null
